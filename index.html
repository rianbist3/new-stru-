<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STRU Closet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ececea; --ink:#111; --muted:#777; --rail:#9a9a98; --chip:#fff;
    --display:'Archivo Black',Impact,sans-serif; --body:'Archivo',system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#161616;--ink:#f2f2f0;--muted:#8d8d8b;--rail:#555;--chip:#262626}
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;
       display:flex;flex-direction:column;align-items:center}
  header{padding:28px 0 0;font-family:var(--display);font-size:26px;letter-spacing:.04em}
  .stage{position:relative;width:100%;flex:1;max-height:560px;margin-top:24px}
  .rail{position:absolute;left:6%;right:6%;top:46px;height:3px;background:var(--rail);border-radius:2px}
  .rail::before,.rail::after{content:"";position:absolute;top:-5px;width:3px;height:13px;background:var(--rail);border-radius:2px}
  .rail::before{left:-4px}.rail::after{right:-4px}
  .item{
    position:absolute;left:50%;top:40px;width:210px;height:200px;border:0;background:none;cursor:pointer;
    transform-origin:50% 8px;
    transform:translateX(calc(-50% + var(--x))) scale(var(--s));
    filter:blur(var(--b)); opacity:var(--o);
    transition:transform .7s cubic-bezier(.2,.8,.2,1),filter .5s,opacity .5s;
    z-index:var(--z);
  }
  .item>svg{width:100%;height:100%;overflow:visible;transform-origin:50% 10%;display:block}
  .item .ph{display:flex;flex-direction:column;align-items:center;width:100%;height:100%;transform-origin:50% 0;pointer-events:none}
  .item .ph .hg{width:30%;height:auto;flex:none;display:block}
  .item .ph img{width:100%;flex:1;min-height:0;object-fit:contain;margin-top:-5px;display:block;
                filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}
  .item:not(.sel):hover>svg,.item:not(.sel):hover .ph{animation:sway 1.4s ease-in-out}
  .item.flip>svg,.item.flip .ph{animation:flip .45s ease}
  .item:focus-visible{outline:2px solid var(--ink);outline-offset:6px;border-radius:8px}
  @keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(3deg)}75%{transform:rotate(-3deg)}}
  @keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  .panel{position:absolute;left:0;right:0;bottom:0;text-align:center;padding:0 16px;
         transition:opacity .4s,transform .5s;}
  .panel.hide{opacity:0;transform:translateY(12px);pointer-events:none}
  h1{font-family:var(--display);font-size:clamp(18px,3vw,26px);text-transform:uppercase;letter-spacing:.02em}
  .row{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--chip);border-radius:99px;padding:3px}
  .seg button{border:0;background:none;color:var(--ink);font:600 12px var(--body);padding:7px 16px;border-radius:99px;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
  .sw{display:flex;gap:8px}
  .sw button{width:22px;height:22px;border-radius:50%;border:2px solid var(--bg);outline:1px solid var(--rail);cursor:pointer}
  .sw button[aria-pressed=true]{outline:2px solid var(--ink)}
  .cta{border:1px solid var(--ink);background:none;color:var(--ink);font:600 12px var(--body);
       padding:9px 20px;border-radius:99px;cursor:pointer;transition:.2s}
  .cta:hover{background:var(--ink);color:var(--bg)}
  .hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:var(--muted);font-size:13px;
        transition:opacity .3s}
  .hint.hide{opacity:0}
  .price{color:var(--muted);font-size:13px;margin-top:6px}
  .nav{position:absolute;top:200px;width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);
       color:var(--ink);font-size:18px;cursor:pointer;z-index:99;transition:opacity .3s}
  .nav.l{left:16px}.nav.r{right:16px}.nav.hide{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.item,.panel{transition:none}.item svg{animation:none!important}}
</style>
</head>
<body>
<header>STRU</header>

<div class="stage" id="stage">
  <div class="rail"></div>
  <button class="nav l hide" id="prev" aria-label="Previous">‹</button>
  <button class="nav r hide" id="next" aria-label="Next">›</button>
  <div class="hint" id="hint">Pick something off the rail</div>
  <div class="panel hide" id="panel">
    <h1 id="name"></h1>
    <div class="price" id="price"></div>
    <div class="row">
      <div class="seg" role="group" aria-label="View">
        <button id="bFront" aria-pressed="true">Front</button>
        <button id="bBack" aria-pressed="false">Back</button>
      </div>
      <div class="sw" id="sw"></div>
      <button class="cta" id="cta">See availability</button>
    </div>
  </div>
</div>

<script>
/* ---------- 1. YOUR PRODUCTS: edit this list ---------- */
/* To use your own photos, add  front:"images/x-front.png", back:"images/x-back.png"
   to a colour, e.g. {n:"Black",hex:"#111",ink:"#fff",front:"images/tee-black-front.png",back:"images/tee-black-back.png"}
   Photos should be PNG/WebP with a transparent background, about 600x850px, same proportions for every item. */
const ITEMS = [
  { name:"STRU Black & Gold Hoodie", price:"", shape:"hoodie", num:"01",
    colors:[{n:"Black & Gold",hex:"#2b2a1c",ink:"#d9b24c",
             front:"images/stru-black-gold-front.webp", back:"images/stru-black-gold-back.webp"}] },
  { name:"STRU Icy Blue Hoodie", price:"", shape:"hoodie", num:"02",
    colors:[{n:"Icy Blue",hex:"#4f93b5",ink:"#fff",
             front:"images/stru-blue-front.webp", back:"images/stru-blue-back.webp"}] },
  { name:"STRU Inferno Red & Cream Hoodie", price:"", shape:"hoodie", num:"03",
    colors:[{n:"Inferno Red & Cream",hex:"#b8312f",ink:"#fff",
             front:"images/stru-red-front.webp", back:"images/stru-red-back.webp"}] },
];
const BRAND = "STRU";

/* ---------- 2. GARMENT DRAWING (inline SVG, no images needed) ---------- */
const PATHS = {
  tee:    "M36 24Q50 36 64 24L92 40 84 60 74 54V130H26V54L16 60 8 40Z",
  tank:   "M32 24Q38 24 40 24Q50 40 60 24L68 24 70 52 74 130H26L30 52Z",
  long:   "M36 24Q50 36 64 24L90 40 96 118 84 120 74 62V130H26V62L16 120 4 118 10 40Z",
  hoodie: "M34 26Q50 40 66 26L90 42 96 120 82 122 74 66V132H26V66L18 122 4 120 10 42Z",
  jacket: "M34 26Q50 38 66 26L90 42 96 124 82 126 74 68V134H26V68L18 126 4 124 10 42Z",
};
function garment(it, ci, view){
  const c = it.colors[ci], p = PATHS[it.shape];
  if(c[view]) return `<div class="ph"><svg class="hg" viewBox="0 0 100 30" aria-hidden="true">
    <path d="M50 22V9a5 5 0 1 1 5 5" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"/>
    <path d="M50 22L6 29H94Z" fill="none" stroke="#888" stroke-width="2" stroke-linejoin="round"/></svg>
    <img src="${c[view]}" alt="${it.name}, ${view}" draggable="false"></div>`; // your photo
  let extra = "";
  if(it.shape==="hoodie") extra += `<path d="M34 26Q50 6 66 26Q50 44 34 26Z" fill="${c.hex}" stroke="rgba(0,0,0,.25)"/>
    <path d="M44 38V54M56 38V54" stroke="${c.ink}" stroke-width="1.5"/>`;
  if(it.shape==="jacket" && view==="front") extra += `<path d="M50 38V134" stroke="${c.ink}" stroke-width="1.5" opacity=".7"/>
    <path d="M26 70H74" stroke="${c.ink}" stroke-width="2" opacity=".35"/>`;
  const art = view==="front"
    ? `<text x="50" y="${it.shape==="tank"?62:70}" text-anchor="middle" font-family="Archivo Black,Impact,sans-serif" font-size="11" letter-spacing=".5" fill="${c.ink}">${BRAND}</text>`
    : `<text x="50" y="86" text-anchor="middle" font-family="Archivo Black,Impact,sans-serif" font-size="34" fill="${c.ink}">${it.num}</text>`;
  return `<svg viewBox="0 0 100 140" aria-hidden="true">
    <path d="M50 12V4a4 4 0 1 1 4 4" fill="none" stroke="#888" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M50 12L22 26H78Z" fill="none" stroke="#888" stroke-width="1.6" stroke-linejoin="round"/>
    <g transform="translate(0,6)">
      <path d="${p}" fill="${c.hex}" stroke="rgba(0,0,0,.28)" stroke-width="1" stroke-linejoin="round"/>
      ${extra}${art}
    </g></svg>`;
}

/* ---------- 3. BEHAVIOUR ---------- */
const $ = id => document.getElementById(id);
const stage=$("stage"), panel=$("panel"), hint=$("hint");
const state = ITEMS.map(()=>({ci:0}));
let sel=-1, view="front";

const els = ITEMS.map((it,i)=>{
  const b=document.createElement("button");
  b.className="item"; b.setAttribute("aria-label",it.name);
  b.innerHTML=garment(it,0,"front");
  b.addEventListener("click",e=>{e.stopPropagation(); select(i)});
  stage.appendChild(b); return b;
});

function layout(){
  const W=stage.clientWidth, n=ITEMS.length, small=W<640;
  const gap=Math.min((W*0.88)/n,small?120:270);
  els.forEach((el,i)=>{
    let x,s,b,o,z;
    if(sel<0){ x=(i-(n-1)/2)*gap; s=small?.9:1.25; b=0; o=1; z=1; }
    else if(i===sel){ x=0; s=small?1.3:1.55; b=0; o=1; z=10; }
    else{
      const d=i-sel, side=Math.sign(d);
      x = side*(small?150:W*0.22) + d*(small?30:gap*0.5);
      s=.7; b=6; o=.65; z=1;
    }
    el.style.setProperty("--x",x+"px");
    el.style.setProperty("--s",s);
    el.style.setProperty("--b",b+"px");
    el.style.setProperty("--o",o);
    el.style.setProperty("--z",z);
    el.classList.toggle("sel",i===sel);
  });
}

function redraw(i){ els[i].innerHTML=garment(ITEMS[i],state[i].ci,view); }

function select(i){
  if(i<0||i>=ITEMS.length) return;
  if(sel!==i){ view="front"; }
  sel=i; layout(); renderPanel();
}
function clearSel(){ if(sel<0)return; const old=sel; sel=-1; view="front"; redraw(old); layout(); renderPanel(); }

function renderPanel(){
  const open=sel>=0;
  panel.classList.toggle("hide",!open);
  hint.classList.toggle("hide",open);
  $("prev").classList.toggle("hide",!open);
  $("next").classList.toggle("hide",!open);
  if(!open) return;
  const it=ITEMS[sel];
  $("name").textContent=it.name;
  $("price").textContent=(it.price?it.price+" · ":"")+it.colors[state[sel].ci].n;
  $("bFront").setAttribute("aria-pressed",view==="front");
  $("bBack").setAttribute("aria-pressed",view==="back");
  const sw=$("sw"); sw.innerHTML=""; sw.style.display=it.colors.length>1?"flex":"none";
  it.colors.forEach((c,k)=>{
    const b=document.createElement("button");
    b.style.background=c.hex; b.title=c.n; b.setAttribute("aria-label",c.n);
    b.setAttribute("aria-pressed",k===state[sel].ci);
    b.onclick=()=>{state[sel].ci=k; redraw(sel); renderPanel();};
    sw.appendChild(b);
  });
  redraw(sel);
}

function setView(v){
  if(sel<0||v===view) return;
  const el=els[sel]; el.classList.add("flip");
  setTimeout(()=>{view=v; redraw(sel); renderPanel();},220);
  setTimeout(()=>el.classList.remove("flip"),460);
}

$("bFront").onclick=()=>setView("front");
$("bBack").onclick=()=>setView("back");
$("prev").onclick=e=>{e.stopPropagation(); select((sel-1+ITEMS.length)%ITEMS.length)};
$("next").onclick=e=>{e.stopPropagation(); select((sel+1)%ITEMS.length)};
$("cta").onclick=()=>alert("Hook this up to your shop link or a product page.");
stage.addEventListener("click",e=>{ if(!e.target.closest(".panel,.nav")) clearSel(); });
addEventListener("keydown",e=>{
  if(e.key==="Escape") clearSel();
  if(sel>=0&&e.key==="ArrowRight") select((sel+1)%ITEMS.length);
  if(sel>=0&&e.key==="ArrowLeft")  select((sel-1+ITEMS.length)%ITEMS.length);
});
addEventListener("resize",layout);
layout();
</script>
</body>
</html>
